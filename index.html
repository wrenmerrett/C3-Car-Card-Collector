<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="./styles/style.css">
    <title>C3: CAR CARD COLLECTOR</title>
    <script type="module" src="./js/app.js"></script>
    <script type="module" src="./js/playerHand.js"></script>
    <script type="module" src="./js/playerGarage.js"></script>
    <script type="module" src="./js/shop.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
            <body>

                <button class="tablink" onclick="openPage('Home', this, 'darkslategrey')" id="defaultOpen">Play</button>
                <button class="tablink" onclick="openPage('Collection', this, 'dodgerblue')">Collection</button>
                <button class="tablink" onclick="openPage('Shop', this, 'goldenrod')">Dealership</button>
                <button class="tablink" onclick="openPage('Stats', this, 'darkolivegreen')">Adventures</button>

                <div id="Home" class="tabcontent">
                    <img id="logo" src="./styles/C3LOGO.png">
                    <br>
                    <button id="saveButton" class="uiButton">SAVE</button>
                    <button id="loadButton" class="uiButton">LOAD</button>
                    <div id="saveWarning"></div>
                <b>
                        <div class="central-elements">
                            <h2 id="cashDisplay"></h2>
                            <div id="heatMeter">
                                <h2 id="heatMeter">HEAT</h2>
                                <div id="heatText"></div>
                                <label class="switch">
                                    <input id="heatSwitch" type="checkbox">
                                    <span class="slider round"></span>
                                  </label>
                                <select id="heatSelector">
                                </select>
                            </div>
                            <h2>YOUR HAND</h2>
                            <table class="cardTable">
                                <tr>
                                    <td><div id="hand1"</td>
                                    <td><div id="hand2"</td>
                                    <td><div id="hand3"</td>
                                    <td><div id="hand4"</td>
                                    <td><div id="hand5"</td>
                                </tr>
                            </table>
                            <div id="synergyZone">ACTIVATE SYNERGIES
                                <label class="switch">
                                    <input id="synergySwitch" type="checkbox">
                                    <span class="slider round"></span>
                                  </label>
                                <div id="synergyRender"></div>
                            </div>
                            <button id="collectButton" data-collect-card>
                                COLLECT
                            </button>
                            <div id="RQLimiter"></div>
                            <div id="handAttributes"></div>
                            <div id="luckFactor"></div>
                            <div id="earningsBonus"></div>
                                <br />
                                NEWEST CARD
                                <di id="newCardPopup"></div>
                            <div id="newestCard" style="position:center"></div>
                        </div>
                </b>
                </div>

                <div id="Collection" class="tabcontent">
                    <h3>Collection</h3>
                    
                    <div>
                        <button id="common" class="tab">Common</button>
                        <button id="uncommon" class="tab">Uncommon</button>
                        <button id="rare" class="tab">Rare</button>
                        <button id="superRare" class="tab">Super Rare</button>
                        <button id="ultraRare" class="tab">Ultra Rare</button>
                        <button id="epic" class="tab">Epic</button>
                        <button id="legendary" class="tab">Legendary</button>
                        <br>
                        </div>
                        <div class = "filterElements";>
                            <div><div>MAKE</div>
                                <select id="makeSelect" class ="garageFilter">
                                <option></option>
                            </select>
                        </div>
                            <div><div>COUNTRY</div>
                                <select id="countrySelect" class ="garageFilter">
                                <option></option>
                            </select>
                        </div>
                            <div><div>DECADE</div>
                                <select id="decadeSelect" class ="garageFilter">
                                <option></option>
                            </select>
                        </div>
                            <div><div>DRIVE</div>
                                <select id="driveSelect" class ="garageFilter">
                                <option></option>
                            </select>
                        </div>
                            <div><div>TYRES</div>
                                <select id="tyreSelect" class ="garageFilter">
                                <option></option>
                            </select>
                        </div>
                            <div><button id="filterButton" class="button-3">Filter</button></div>
                            <div id="handRQ"></div>
                        </div>
                        <h4>Owned</h4>
                        <div id="fullhandbox">
                        </div>
                        <div class="gridContainer" id="garageGrid">
                        </div>
                        <h4>Unowned</h4>
                        <div class="gridContainer" id="unownedGrid">
                        </div>
                        <h4 class="eliteText">Elite</h4>
                        <div class="gridContainer" id="eliteGrid">
                        </div>
                        </div>

                <div id="Shop" class="tabcontent">
                    <h3>Dealership</h3>
                    <h4 class="shopHeader">Welcome to the Dealership! Open for business!</h4>
                    <b id="restockPrice"></b>
                    <button id="restocker" class="button-3">RESTOCK</button>
                    <b id="brokeMessage"></b>
                    <div class="gridContainer" id="shopGrid"></div>
                    </div>

                

    <div id="Stats" class="tabcontent">
        <h3>Adventures</h3>
        <p>Coming soon!</p>
    </div>

    <script>
        function openPage(pageName, elmnt, color) {
        var i, tabcontent, tablinks;
        tabcontent = document.getElementsByClassName("tabcontent");
        for (i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = "none";
            }
        tablinks = document.getElementsByClassName("tablink");
        for (i = 0; i < tablinks.length; i++) {
            tablinks[i].style.backgroundColor = "";
        }
        document.getElementById(pageName).style.display = "block";
        elmnt.style.backgroundColor = color;
    }

        // Get the element with id="defaultOpen" and click on it
        document.getElementById("defaultOpen").click();
    </script>

    </body>
</html>
